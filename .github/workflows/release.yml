name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify the release tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on the main line."
            exit 1
          fi

      # Guard: package.json version AND the CHANGELOG must match the release
      # tag (tags are `v`-prefixed), so a mistyped tag, a forgotten version
      # bump, or an un-cut changelog cannot publish the wrong version.
      - name: Verify version and changelog match the tag
        run: |
          VER_EXPECT="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$VER_EXPECT" != "$VER" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${VER_EXPECT//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VER_EXPECT]' section; cut it before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # A git dependency in `dependencies` ships to every consumer: their npm
      # re-resolves the spec out of this tarball's manifest, so the install
      # needs git and GitHub reachability and has no registry tarball to check
      # an integrity hash against. The manifest was never inspected before a
      # publish, which is how the engine's `github:` pin survived to a release
      # candidate here and reached the registry in
      # markup-carve/carve-grammars#276's repo.
      - name: No dependency is installed over git
        run: node tools/no-git-dependencies.mjs

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Publish authenticates via the NPM_TOKEN repo secret (a granular token
      # with read/write on the @markup-carve scope). setup-node already wrote
      # the registry .npmrc; NODE_AUTH_TOKEN supplies the credential.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
