name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # A release is STARTED here. The `tag` job below creates the tag after the
  # gates and after the approval, so starting a release no longer means pushing
  # a tag by hand. Dispatched at an existing tag with no version it re-runs that
  # one instead, which a tag push cannot do: recreating a tag under the same
  # name fires no push event.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (e.g. 0.1.9). Leave empty when dispatching at an existing tag.'
        required: false
        type: string

# The tag this run releases: the one that was pushed, or the one a dispatch will
# create. Every gate below reads this, so a dispatch and a tag push measure the
# same version.
env:
  RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}


# Every job below carries a timeout-minutes bound, so a hung step fails in
# minutes instead of running to GitHub's 360-minute default.
jobs:
  npm-credential:
    name: The npm credential can publish this package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # GATE, and a separate job on purpose. The first irreversible act in this
      # workflow is `npm publish` itself, so the publish job has to depend on a
      # job it cannot reach past. Written as a step inside the publish job it
      # would be skippable while the job still reported green, which is the
      # shape that shipped a vulnerable carve-py in this organization.
      #
      # WHY IT EXISTS. carve-grammars v0.1.13, 2026-10-08: every gate passed,
      # the release was approved, the tag was created, Packagist served it
      # within two minutes, and then `npm publish` answered
      # "404 Not Found - PUT" on the package URL. npm answers 404 rather than
      # 403 for a scoped package so it does not leak existence, so that is an
      # authorization failure and not a missing package: 0.1.11 was serving at
      # the time. The result was a version on Packagist that npm did not have.
      # A credential is checkable without publishing anything, and it was the
      # one precondition no gate checked.
      #
      # Nothing below publishes, changes or deprecates anything.
      - name: The token is live and can write this package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not readable from this repository, so the publish cannot authenticate at all."
            exit 1
          fi

          # FATAL. An expired, revoked or malformed token fails here with
          # 401 / ENEEDAUTH, and this is the one probe below whose failure is
          # unambiguous.
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::npm rejected the credential: ${who}"
            echo "::error::rotate NPM_TOKEN before releasing. A 404 on PUT is an auth failure, not a missing package."
            exit 1
          fi
          echo "authenticated as ${who}"

          pkg="$(node -p "require('./package.json').name")"
          echo "package under release: ${pkg}"

          # REPORTED, NOT FATAL, and measured rather than assumed. This is the
          # organization endpoint /-/org/<scope>/package, an org read and not a
          # package write. On carve-wasm run 32156381782 this organization's
          # NPM_TOKEN answered 403 "You may not perform that action with these
          # credentials" here, while an anonymous GET of the same URL returned
          # the whole scope. A credential with fewer rights than a stranger on
          # an org endpoint is the signature of a granular access token, which
          # says nothing about whether it can publish. Made fatal, as the first
          # draft of this gate had it, this would refuse every release in this
          # organization.
          echo "== packages this credential can see in the scope"
          if ! npm access list packages 2>&1; then
            echo "  REFUSED on the org endpoint. An anonymous reader is not refused here, so this"
            echo "  is about the credential's kind, not about the scope being unreachable."
          fi

          # The discriminator, and the reason the two probes above are not
          # enough. A classic automation token can read this endpoint and a
          # granular one cannot. A classic token carries its owner's publish
          # rights, so with a read-write grant below the publish is as proven
          # as it gets without publishing. A granular token's package grants
          # are fixed when it is created and are not readable from here at all,
          # which is the residual risk this gate cannot close.
          echo "== the kind of credential"
          if npm token list >/dev/null 2>&1; then
            echo "  classic automation token: it carries the owner's publish rights."
          else
            echo "  granular access token: its package grants are fixed at creation and cannot be"
            echo "  read from here. If this package is not among them the publish fails with E404"
            echo "  and no change in this repository can fix it. Check the token at npmjs.com."
          fi

          # FATAL ONLY ON A DEFINITE NEGATIVE. Note what this is and is not:
          # the collaborators endpoint is a PUBLIC read, so it reports the npm
          # USER's grant on the package and not the token's. A read-only grant
          # therefore means the publish cannot succeed whatever the token is,
          # which is worth stopping for; read-write does not prove the token
          # inherits it, which is why it is not reported as a pass.
          echo "== the account's grant on the package"
          if grants="$(npm access list collaborators "${pkg}" --json 2>/dev/null)"; then
            mine="$(printf '%s' "${grants}" | jq -r --arg u "${who}" '.[$u] // "not listed"')"
            echo "  ${who}: ${mine}"
            if [ "${mine}" = "read-only" ]; then
              echo "::error::${who} holds read-only access to ${pkg}, so the publish cannot succeed."
              echo "::error::grant write access or rotate NPM_TOKEN before releasing."
              exit 1
            fi
          else
            echo "  the endpoint did not answer, which does not distinguish 'no permission' from"
            echo "  'no such package', so it is not treated as a verdict."
          fi

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [npm-credential, tag]
    permissions:
      # `write`, not `read`, and the gate below is the whole reason: a DRAFT
      # release is invisible to a caller without push access, so under
      # `contents: read` the listing comes back empty and the gate reports
      # "no release" for a draft that is sitting right there with notes in
      # it. See markup-carve/carve-wasm#80.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The draft must describe the tagged changelog section before publishing.
      # Relative changelog links resolve against this tag in the release body.
      # rehearse-release-notes.yml runs the same script against a draft.
      - name: The release notes match this tag's changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/run-release-notes-gate.sh "$RELEASE_TAG"

      - name: Verify the release tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $RELEASE_TAG is not on the main line."
            exit 1
          fi

      # Guard: package.json version AND the CHANGELOG must match the release
      # tag (tags are `v`-prefixed), so a mistyped tag, a forgotten version
      # bump, or an un-cut changelog cannot publish the wrong version.
      - name: Verify version and changelog match the tag
        run: |
          VER_EXPECT="${RELEASE_TAG#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$VER_EXPECT" != "$VER" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package.json version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${VER_EXPECT//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VER_EXPECT]' section; cut it before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # A git dependency in `dependencies` ships to every consumer: their npm
      # re-resolves the spec out of this tarball's manifest, so the install
      # needs git and GitHub reachability and has no registry tarball to check
      # an integrity hash against. The manifest was never inspected before a
      # publish, which is how the engine's `github:` pin survived to a release
      # candidate here and reached the registry in
      # markup-carve/carve-grammars#276's repo.
      - name: No dependency is installed over git
        run: node tools/no-git-dependencies.mjs

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Publish authenticates via the NPM_TOKEN repo secret (a granular token
      # with read/write on the @markup-carve scope). setup-node already wrote
      # the registry .npmrc; NODE_AUTH_TOKEN supplies the credential.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # A registry publish is not finished until the release page exists. The
      # tag is pushed, CI publishes, the registry answers 200, and "released"
      # feels done - while `/releases` still shows a draft, so a reader has no
      # notes and no changelog for the version they just installed. Doing it
      # here rather than by hand also means the draft stops being a thing
      # someone has to remember to publish at the right moment.
      #
      # Last, deliberately: a draft that stays a draft is recoverable, and one
      # published beside a failed publish is not.
      - name: Publish the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/run-release-notes-gate.sh "$RELEASE_TAG" "$RUNNER_TEMP/release.json"
          release="$(cat "$RUNNER_TEMP/release.json")"
          id="$(printf '%s' "$release" | jq -r 'select(.draft) | .id // empty')"
          if [ -z "$id" ]; then
            echo "The release is already published."
            exit 0
          fi
          # `tag_name` goes with every PATCH of a release. Omit it on a DRAFT
          # and GitHub replaces the tag with a generated `untagged-*`
          # placeholder, because a draft's tag is a string on the object rather
          # than a git ref - so the field has nothing to fall back to.
          # `-F` (not `-f`) for draft, so it is sent as a boolean.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$RELEASE_TAG" -F draft=false --jq '"published \(.tag_name)"'
          # Read it back: exit status does not tell you whether the tag survived.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"draft=\(.draft) tag=\(.tag_name)"'

  # THE TAG IS CREATED HERE, after a human approves, so a release can be started
  # without a tag existing - which is the whole point: creating the tag by hand
  # was the maintainer's step.
  # It needs every gate job, so whoever approves is looking at a green
  # gate rather than at nothing.
  #
  # A tag push still works unchanged: the step finds the tag already on the
  # remote and creates nothing. The publish runs in THIS run rather than on the
  # new tag, because a ref created with github.token triggers no workflow.
  tag:
    name: Create the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [npm-credential]
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the tag unless it already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already on the remote; creating nothing."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::this run is on tag $RELEASE_TAG, which is not on the remote."
            exit 1
          fi
          # Re-checked under the approval: a tag can appear while a run waits.
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tagged $RELEASE_TAG at $GITHUB_SHA"
