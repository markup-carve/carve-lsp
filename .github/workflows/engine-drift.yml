name: Engine drift

# This repo does not implement Carve - it calls an engine that is already
# corpus-gated in its own repository. What can rot here is the DEPENDENCY:
# nobody notices when the engine stops moving, and CI stays green because
# hand-written expectations are satisfied by a stale parser exactly as well as
# by a current one (carve#735).
#
# The pin here is EXACT (`"@markup-carve/carve": "0.1.4"`, deliberately - the
# server reports positions and an engine changing its position units mid-range
# would move every column it reports). An exact pin makes the first distance
# below sharper than it is in the sibling repos: a `^0.1.4` range at least
# picks up a `0.1.5`, an exact pin does not move for anything. It is also a
# REGISTRY pin, not a commit: a `github:` spec in `dependencies` makes every
# consumer clone the engine over git, so the git arm below now describes a
# state that ci.yml rejects on the pull request that would introduce it.
#
# THREE QUESTIONS, deliberately kept apart:
#
#   1. Where is the pin against the registry, and does the lockfile agree with
#      it? Cheap, and the answer is a version string.
#
#   2. Where is the registry against carve-js `main`? This is the one that
#      actually failed: a June engine sat in six repos while every range was
#      satisfied and every check was green (carve#499). No pin check can see
#      it, because nothing about the pin is wrong - the PUBLISHED engine had
#      stopped tracking the source.
#
#   3. What does THIS SERVER do with the engine that is coming? A version
#      distance is a proxy. The analysis switches on AST node types, so a
#      renamed type is a silently lost token rather than an error - which is
#      not hypothetical: `footnote` became `footnote_ref` and `critic-comment`
#      became `critic_comment` inside the `0.1.x` line (carve#405), and both
#      were found by hand. Question 3 runs the corpus through the built server
#      twice, once per engine, and prints the difference.
#
# 1 and 2 WARN: upstream moving is not a defect here, and a job that goes red
# for something outside the repository teaches people to ignore it. They fail
# only when the pin resolves to nothing or the lockfile contradicts it, which
# means an install here is broken. 3 FAILS when a document throws, because a
# server that crashes on a document the coming engine emits is this repo's
# defect and its user sees it as a dead editor.

on:
  schedule:
    # 05:00 UTC daily, alongside the other drift runs in the org.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  engine-pin:
    name: The pin, the lockfile and the registry agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare the pin against the registry
        id: registry
        run: |
          set -euo pipefail
          pkg='@markup-carve/carve'
          spec="$(node -p "const p=require('./package.json');const d=p.dependencies||{},v=p.devDependencies||{};d['${pkg}']||v['${pkg}']||''")"
          if [ -z "${spec}" ]; then
            echo "::error::${pkg} is not a dependency of this repo - this workflow is watching nothing"
            exit 1
          fi
          # `npm view <pkg>@<range> version` prints ONE bare version when the
          # range matches a single release, and `<pkg>@<v> '<v>'` lines when it
          # matches several. Taking the last WHITESPACE-SEPARATED FIELD reads
          # both; `tail -1` alone concatenates the spec onto the version the
          # moment a second matching release exists, yielding
          # `@markup-carve/carve@0.1.20.1.2` rather than a version.
          # THE PIN IS NOT ALWAYS A REGISTRY RANGE. It read `0.1.3` until the
          # composite-figure work needed an engine that was not released yet, and
          # it has been a git URL at an exact carve-js commit ever since. `npm view
          # <pkg>@<git url>` cannot resolve that, so this step failed EVERY
          # scheduled run from 2026-08-16 onward, announcing "resolves to nothing
          # on the registry - an install here is broken" about a pin that installs
          # perfectly well. A watchdog that cries wolf daily is one nobody reads,
          # and this one had six red days on it before anybody looked.
          #
          # So the two pin shapes are told apart, and each is checked against the
          # thing that can answer for it: a range against the registry, a commit
          # against carve-js history in the step below.
          latest="$(npm view "${pkg}" version 2>/dev/null | tr -d "'\"" | awk '{print $NF}')"
          # The read is checked for the SHAPE of a version before anything is
          # compared. Without this the workflow's failure mode is silence: a
          # mis-read compares unequal to everything, so the drift warning fires
          # with a nonsense string in it and reads as a result (carve#755).
          case "${latest}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::the registry's latest ${pkg} read back as \"${latest}\", which is not a version - every comparison below it would be meaningless"; exit 1 ;;
          esac

          case "${spec}" in
            git+*|github:*|*github.com*)
              commit="${spec##*#}"
              if [ "${commit}" = "${spec}" ] || [ -z "${commit}" ]; then
                echo "::error::${pkg} is pinned to ${spec}, a git dependency with no commit after '#' - it floats, so what CI tested is not what the next install gets"
                exit 1
              fi
              echo "declared        ${spec}"
              echo "pinned commit   ${commit}"
              echo "registry latest ${latest}"
              echo "::warning::${pkg} is pinned to a carve-js COMMIT, not a registry release. The published ${latest} cannot reach this repo, and no release arrives on its own."
              echo "kind=git" >> "${GITHUB_OUTPUT}"
              echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              # `npm view <pkg>@<range> version` prints ONE bare version when the
              # range matches a single release, and `<pkg>@<v> '<v>'` lines when it
              # matches several. Taking the last WHITESPACE-SEPARATED FIELD reads
              # both; `tail -1` alone concatenates the spec onto the version the
              # moment a second matching release exists, yielding
              # `@markup-carve/carve@0.1.20.1.2` rather than a version.
              resolved="$(npm view "${pkg}@${spec}" version 2>/dev/null | tail -1 | tr -d "'\"" | awk '{print $NF}')"
              if [ -z "${resolved}" ]; then
                echo "::error::${pkg}@${spec} resolves to nothing on the registry - an install here is broken"
                exit 1
              fi
              case "${resolved}" in
                [0-9]*.[0-9]*.[0-9]*) ;;
                *) echo "::error::resolved read back as \"${resolved}\" from the registry, which is not a version - every comparison below it would be meaningless"; exit 1 ;;
              esac
              echo "declared        ${spec}"
              echo "resolves to     ${resolved}"
              echo "registry latest ${latest}"
              if [ "${resolved}" != "${latest}" ]; then
                echo "::warning::${pkg} ${latest} is published, but this repo takes ${resolved} - the pin is exact, so no release arrives on its own"
              fi
              echo "kind=registry" >> "${GITHUB_OUTPUT}"
              ;;
          esac
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: The declared pin and the lockfile agree
        run: |
          set -euo pipefail
          pkg='@markup-carve/carve'
          declared="$(node -p "const p=require('./package.json');const d=p.dependencies||{},v=p.devDependencies||{};d['${pkg}']||v['${pkg}']||''")"
          locked="$(node -p "require('./package-lock.json').packages['node_modules/${pkg}'].version")"
          resolved="$(node -p "require('./package-lock.json').packages['node_modules/${pkg}'].resolved || ''")"
          echo "package.json ${declared}; package-lock.json version ${locked}, resolved ${resolved}"
          if [ "${{ steps.registry.outputs.kind }}" = "git" ]; then
            # Under a git pin the lockfile's `version` is whatever the engine's own
            # package.json happened to say at that commit - a release number that
            # was never published FROM that commit. Comparing it to the declared
            # spec therefore always differs, which is the second way this job
            # erred out on a healthy install. The field that answers "is this the
            # commit the manifest asks for" is `resolved`.
            commit='${{ steps.registry.outputs.commit }}'
            case "${resolved}" in
              *"${commit}") ;;
              *) echo "::error::package.json pins carve-js commit ${commit} but the lockfile resolves to ${resolved} - what CI tests is not what the manifest says"; exit 1 ;;
            esac
          elif [ "${declared}" != "${locked}" ]; then
            echo "::error::package.json declares ${declared} but the lockfile installs ${locked} - what CI tests is not what the manifest says"
            exit 1
          fi

      - name: Check out the engine
        uses: actions/checkout@v7
        with:
          repository: markup-carve/carve-js
          path: carve-js
          fetch-depth: 0

      - name: Compare the published engine against carve-js main
        run: |
          set -euo pipefail
          latest='${{ steps.registry.outputs.latest }}'

          # A commit pin can be located in carve-js history directly, which is a
          # sharper answer than any version distance: it says exactly how far the
          # engine this repo SHIPS is from the language. The registry comparison
          # below cannot see it at all, because nothing about the pin is a version.
          if [ "${{ steps.registry.outputs.kind }}" = "git" ]; then
            commit='${{ steps.registry.outputs.commit }}'
            if ! git -C carve-js rev-parse --verify "${commit}^{commit}" >/dev/null 2>&1; then
              echo "::error::the pinned carve-js commit ${commit} is not in carve-js history - the pin names something that cannot be reviewed"
              exit 1
            fi
            behind="$(git -C carve-js rev-list --count "${commit}..origin/main")"
            echo "pinned carve-js ${commit} ($(git -C carve-js log -1 --format=%s "${commit}"))"
            echo "carve-js main is ${behind} commit(s) ahead of it"
            if [ "${behind}" -gt 0 ]; then
              echo "::warning::the engine this repo pins is ${behind} commit(s) behind carve-js main"
            fi
          fi

          tag=""
          for candidate in "${latest}" "v${latest}"; do
            if git -C carve-js rev-parse "${candidate}" >/dev/null 2>&1; then
              tag="${candidate}"
              break
            fi
          done
          if [ -z "${tag}" ]; then
            echo "::warning::carve-js has no tag for the published ${latest}, so the published engine cannot be located in the source"
            exit 0
          fi
          behind="$(git -C carve-js rev-list --count "${tag}..origin/main")"
          echo "published ${latest} is carve-js ${tag} ($(git -C carve-js log -1 --format=%s "${tag}"))"
          echo "carve-js main is ${behind} commit(s) ahead of it"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the PUBLISHED engine ${latest} is ${behind} commit(s) behind carve-js main - every repo installing from the registry is that far behind the language, however current its pin is"
          fi

  future-engine:
    name: The server survives the engine that is coming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out the corpus from carve main
        uses: actions/checkout@v7
        with:
          repository: markup-carve/carve
          path: carve-main

      - name: Check out and build carve-js main
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/markup-carve/carve-js.git upstream-carve-js
          npm --prefix upstream-carve-js ci
          npm --prefix upstream-carve-js run build
          echo "carve-js main: $(git -C upstream-carve-js rev-parse HEAD)"

      - name: Build the server against the pinned engine
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Corpus through the server, pinned engine
        id: pinned
        run: |
          set -euo pipefail
          out="$(node tools/corpus-through-server.mjs carve-main/tests/corpus --manifest pinned-manifest.tsv | tee /dev/stderr)"
          for key in documents threw tokens diagnostics; do
            printf '%s=%s\n' "${key}" "$(printf '%s\n' "$out" | sed -n "s/^${key}=//p")" >> "${GITHUB_OUTPUT}"
          done

      - name: Swap in carve-js main and run the corpus again
        run: |
          set -euo pipefail
          # dist/ is plain JavaScript, so it is not rebuilt: a `case` arm naming
          # a node type the newer engine no longer emits is dead at runtime
          # rather than a compile error, and that dead arm is precisely the
          # state this step exists to measure. Rebuilding would turn it into a
          # type error and hide the count.
          rm -rf node_modules/@markup-carve/carve
          mkdir -p node_modules/@markup-carve/carve
          cp -r upstream-carve-js/dist node_modules/@markup-carve/carve/dist
          cp upstream-carve-js/package.json node_modules/@markup-carve/carve/package.json
          # The swapped-in engine brings its own RUNTIME DEPENDENCIES, and copying
          # only `dist` leaves them unresolvable. That is not hypothetical: when
          # carve-js main gained `parse5` for html-import while the pin here did
          # not have it yet, this step died with ERR_MODULE_NOT_FOUND before
          # measuring a single document, and did so for three consecutive
          # scheduled runs (2026-08-12 through 2026-08-14). It stopped only
          # because the pin later moved to a commit that happens to depend on
          # parse5 too, which masks the defect rather than fixing it: the next
          # dependency carve-js main adds brings it straight back.
          #
          # Upstream's own node_modules is already installed by the step above and
          # Node resolves a package's dependencies from its own node_modules
          # first, so copying it in place is self-contained. Re-running `npm
          # install` here is NOT the fix: it would re-resolve the manifest and
          # overwrite the engine that was just swapped in.
          cp -r upstream-carve-js/node_modules node_modules/@markup-carve/carve/node_modules

          out="$(node tools/corpus-through-server.mjs carve-main/tests/corpus --manifest current-manifest.tsv | tee /dev/stderr)"
          threw="$(printf '%s\n' "$out" | sed -n 's/^threw=//p')"
          documents="$(printf '%s\n' "$out" | sed -n 's/^documents=//p')"
          tokens="$(printf '%s\n' "$out" | sed -n 's/^tokens=//p')"
          diagnostics="$(printf '%s\n' "$out" | sed -n 's/^diagnostics=//p')"

          echo "pinned engine : ${{ steps.pinned.outputs.threw }} threw, ${{ steps.pinned.outputs.tokens }} tokens, ${{ steps.pinned.outputs.diagnostics }} diagnostics over ${{ steps.pinned.outputs.documents }} documents"
          echo "carve-js main : ${threw} threw, ${tokens} tokens, ${diagnostics} diagnostics over ${documents} documents"

          if [ "${threw}" -gt 0 ]; then
            echo "::error::the server throws on ${threw} of ${documents} corpus documents with carve-js main - upgrading the pin as it stands would give every editor a dead server on those documents"
            exit 1
          fi

          # Compared as SETS OF PER-DOCUMENT ROWS, not as totals. The totals are
          # sums over the corpus, so a document that loses semantic tokens and
          # another that gains the same number leave both totals identical - and
          # the check would then report that the engine bump changes nothing
          # while the server had in fact stopped tokenizing one construct and
          # started tokenizing another. Two different distributions of the same
          # size compare equal; that is the defect this whole workflow exists to
          # stop shipping (carve#927), and it was in the workflow itself.
          changed="$(diff <(sort pinned-manifest.tsv) <(sort current-manifest.tsv) \
                       | grep -E '^[<>]' | awk '{print $2}' | sort -u || true)"
          if [ -n "${changed}" ]; then
            count="$(printf '%s\n' "${changed}" | wc -l | tr -d ' ')"
            echo "documents this server reads differently under carve-js main:"
            printf '%s\n' "${changed}" | sed 's/^/  /'
            echo "::warning::the coming engine changes what this server reports on ${count} of ${documents} documents (totals ${{ steps.pinned.outputs.tokens }} -> ${tokens} semantic tokens, ${{ steps.pinned.outputs.diagnostics }} -> ${diagnostics} diagnostics). Neither is wrong on its own; the point is that the pin bump is not a no-op, and the per-document list above says where."
          else
            echo "no document is read differently under carve-js main"
          fi
