name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Prefer HTTPS for Git dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm run build
      - run: npm test

      # The unit suite reads exactly ONE file out of the tests/spec submodule
      # (tests/include-security-conformance/vectors.json, 12 vectors). It reads no
      # corpus document at all, so every `chore: bump spec corpus` PR was gated by a
      # check that could not tell one corpus from another: measured on this repo,
      # deleting the entire tests/spec/tests/corpus directory left the suite green at
      # 272 of 272. The submodule bump was reviewed on a green that carried no
      # information about the thing being bumped.
      #
      # tools/corpus-through-server.mjs already drives every corpus document through
      # the built server, and already refuses to report over a short population. It
      # existed only in the scheduled engine-drift workflow, which clones carve main
      # and therefore never looks at the pin this repo actually ships. Running it here
      # against the SUBMODULE is what makes the pin gated: a truncated checkout, a
      # corpus that needs regenerating, or a document this server throws on now turns
      # the pull request red instead of arriving after the merge.
      - name: The pinned corpus goes through the server
        run: node tools/corpus-through-server.mjs tests/spec/tests/corpus
