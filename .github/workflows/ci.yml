name: CI

on:
  push:
    branches: [main, next2]
  pull_request:
    branches: [main, next2]

# Only PR runs share a group; every other run gets its own so none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job below carries a timeout-minutes bound, so a hung step fails in
# minutes instead of running to GitHub's 360-minute default.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify package version has release notes
        run: |
          VER="$(node -p "require('./package.json').version")"
          if ! grep -qE "^## \[?${VER//./\\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::package.json is $VER but CHANGELOG.md has no matching release section."
            exit 1
          fi
      # tools/no-git-dependencies.mjs runs only in release.yml: main may pin a
      # merged carve-js commit between releases, and publishing one is refused.
      # src/no-git-dependencies.test.ts proves the guard on every PR.
      - name: Prefer HTTPS for Git dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      # npm cannot prepare carve-js next2 from git since 125128f4: its build reads
      # scripts/, which .gitattributes export-ignores (markup-carve/carve-js#5085).
      # Install without lifecycle scripts, then build the pinned commit from a clone.
      # Drop this step and go back to a plain `npm ci` once #5085 is fixed.
      - run: npm ci --ignore-scripts
      - name: Build the pinned carve-js commit
        run: |
          SHA="$(node -p "require('./package.json').dependencies['@markup-carve/carve'].split('#')[1]")"
          git clone --quiet --filter=blob:none https://github.com/markup-carve/carve-js.git "$RUNNER_TEMP/carve-js"
          git -C "$RUNNER_TEMP/carve-js" checkout --quiet "$SHA"
          (cd "$RUNNER_TEMP/carve-js" && npm ci --no-audit --no-fund && npm run build)
          cp -r "$RUNNER_TEMP/carve-js/dist" node_modules/@markup-carve/carve/
      - run: npm run build
      - run: npm test

      # Every input of the pinned spec's 0.2 conformance examples goes through the
      # built server; the 0.1 corpus that corpus-through-server.mjs reads is gone
      # from carve next2.
      - name: The pinned spec examples go through the server
        run: node tools/examples-through-server.mjs tests/spec/spec/0.2/conformance/examples.json
